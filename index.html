<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Miracle F&amp;B Dashboard</title>
  <style>
    :root{color-scheme:light;font-family:Pretendard,'Noto Sans KR',Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',Arial,sans-serif;background:#f4f7fb;color:#111827}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb}
    .box{width:min(520px,calc(100vw - 40px));padding:30px 28px;border:1px solid #dbe3ef;border-radius:16px;background:#fff;box-shadow:0 18px 48px rgba(15,23,42,.08)}
    h1{margin:0 0 10px;font-size:22px;line-height:1.35;letter-spacing:0;color:#111827}
    p{margin:0 0 18px;color:#536276;font-size:14px;line-height:1.65}
    button{height:42px;padding:0 16px;border:0;border-radius:10px;background:#111827;color:#fff;font-weight:700;cursor:pointer}
    .row{display:flex;gap:10px;margin-top:12px}
    input{flex:1;height:42px;padding:0 12px;border:1px solid #d6dfec;border-radius:10px;font-size:14px}
    .error{color:#b91c1c;font-weight:700}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="box" id="gate">
    <h1>Miracle F&amp;B Dashboard</h1>
    <p id="message">비밀번호를 입력하면 대시보드가 열립니다.</p>
    <div class="row" id="passwordRow">
      <input id="accessPassword" type="password" placeholder="비밀번호" autocomplete="current-password">
      <button id="passwordBtn" type="button">확인</button>
    </div>
    <div class="row hidden" id="keyRow">
      <input id="manualKey" type="password" placeholder="Access key">
      <button id="openBtn" type="button">Open</button>
    </div>
  </div>
  <script>
    const iv = "NTNNR8y3F5BBi-gF";
    const payloadUrl = "payload.txt?v=9f87fa8618a6";
    const requiredPassword = "12345";

    function fromBase64url(value) {
      const text = String(value || "").replace(/-/g, "+").replace(/_/g, "/");
      const padded = text + "=".repeat((4 - text.length % 4) % 4);
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function keyFromLocation() {
      const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
      return hash.get("k") || hash.get("key") || "";
    }

    async function openDashboard(keyText) {
      const message = document.getElementById("message");
      try {
        if (!keyText) throw new Error("Missing access key.");
        message.textContent = "대시보드를 여는 중입니다.";
        const rawKey = fromBase64url(keyText);
        const cryptoKey = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
        const payload = await fetch(payloadUrl, { cache: "no-store" }).then(async (res) => {
          if (!res.ok) throw new Error("Could not load encrypted dashboard payload.");
          return fromBase64url(await res.text());
        });
        const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromBase64url(iv) }, cryptoKey, payload);
        const html = new TextDecoder().decode(plain);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        const freshUrl = location.origin + location.pathname + "?v=" + Date.now() + location.hash;
        const reason = error && error.name === "OperationError"
          ? "브라우저 캐시로 이전 잠금 페이지와 최신 데이터가 섞였습니다."
          : String(error.message || error);
        message.innerHTML = '<span class="error">대시보드 접근에 실패했습니다.</span><br>' + reason + '<br><a href="' + freshUrl + '">캐시를 새로고침해서 다시 열기</a>';
      }
    }

    function unlock() {
      const password = document.getElementById("accessPassword").value;
      const message = document.getElementById("message");
      if (requiredPassword && password !== requiredPassword) {
        message.innerHTML = '<span class="error">비밀번호가 올바르지 않습니다.</span>';
        document.getElementById("accessPassword").select();
        return;
      }
      const key = keyFromLocation();
      if (key) {
        openDashboard(key);
        return;
      }
      message.textContent = "공유 링크가 잘렸다면 Access key를 입력하세요.";
      document.getElementById("passwordRow").classList.add("hidden");
      document.getElementById("keyRow").classList.remove("hidden");
      document.getElementById("manualKey").focus();
    }

    document.getElementById("openBtn").onclick = () => {
      const key = document.getElementById("manualKey").value.trim();
      if (key) location.hash = "k=" + encodeURIComponent(key);
      openDashboard(key);
    };
    document.getElementById("passwordBtn").onclick = unlock;
    document.getElementById("accessPassword").addEventListener("keydown", (event) => {
      if (event.key === "Enter") unlock();
    });
    document.getElementById("accessPassword").focus();
  </script>
</body>
</html>
