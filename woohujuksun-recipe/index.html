<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우후죽순 레시피</title>
  <style>
    :root {
      --bg: #eef0ed;
      --surface: #ffffff;
      --surface-soft: #f7f8f4;
      --ink: #17231d;
      --muted: #7a837b;
      --line: #e3e7df;
      --line-strong: #d4dbd0;
      --brand: #0b5f3e;
      --brand-dark: #0f2419;
      --sidebar: #f9faf7;
      --sidebar-2: #ffffff;
      --accent: #0b5f3e;
      --soft: #e7efe9;
      --pending: #f6efe4;
      --warning: #ad4a3b;
      --radius: 18px;
      --radius-sm: 12px;
      --shadow: 0 24px 70px rgba(29, 38, 32, .12);
      --shadow-card: 0 8px 24px rgba(27, 38, 31, .055);
      --shadow-hover: 0 18px 38px rgba(27, 38, 31, .12);
      --cat: #0b5f3e;
      --cat-soft: #e7efe9;
      --cat-ink: #16402e;
    }

    * { box-sizing: border-box; }

    html {
      overflow-y: scroll;
      scrollbar-gutter: stable;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 8% 4%, rgba(255, 255, 255, .95), rgba(255, 255, 255, 0) 310px),
        radial-gradient(circle at 84% 12%, rgba(202, 215, 198, .36), rgba(202, 215, 198, 0) 360px),
        var(--bg);
      color: var(--ink);
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button { font: inherit; color: inherit; }

    .shell {
      min-height: calc(100vh - 24px);
      display: grid;
      grid-template-columns: 244px minmax(0, 1fr);
      gap: 14px;
      max-width: none;
      margin: 12px auto;
      width: calc(100% - 24px);
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      overflow: visible;
    }

    .sidebar {
      position: sticky;
      top: 12px;
      align-self: start;
      height: calc(100vh - 24px);
      padding: 24px 14px 20px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .96), rgba(255, 255, 255, .74) 260px),
        linear-gradient(180deg, var(--sidebar), var(--sidebar-2));
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: 18px;
      border: 1px solid rgba(227, 231, 223, .96);
      border-radius: 26px;
      box-shadow: 0 18px 46px rgba(27, 38, 31, .10);
    }

    .brand {
      display: grid;
      gap: 5px;
      align-items: center;
      padding: 2px 8px 10px;
    }

    .brand strong {
      font-size: 22px;
      line-height: 1.18;
      font-weight: 860;
      letter-spacing: 0;
      color: var(--brand);
      white-space: nowrap;
    }

    .brand span {
      color: #6e776d;
      font-size: 11.5px;
      line-height: 1.35;
    }

    .nav-label {
      margin: 0 8px -8px;
      color: #a0a69f;
      font-size: 10px;
      font-weight: 760;
      letter-spacing: .08em;
    }

    .nav {
      display: grid;
      gap: 3px;
      flex: 1;
      align-content: start;
      overflow: auto;
      padding: 0 4px 0 2px;
    }

    .nav button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 10px 8px 10px 22px;
      text-align: left;
      background: transparent;
      color: #7a8279;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      font-weight: 650;
      position: relative;
      box-shadow: none;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }

    .nav button::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      height: auto;
      border-radius: 12px 0 0 12px;
      background: var(--brand);
      opacity: 0;
      transition: opacity .18s ease;
    }

    .nav button:hover {
      background: #f1f4ef;
      color: #18251e;
    }

    .nav button.active {
      background: #edf3ee;
      color: #10231a;
      font-weight: 760;
    }

    .nav button.active::before {
      opacity: 1;
    }

    .nav small {
      min-width: 22px;
      height: 18px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #eef1ec;
      color: #7a8279;
      font-size: 10px;
      font-weight: 740;
      letter-spacing: 0;
    }

    .nav button.active small {
      background: var(--brand);
      color: #ffffff;
    }

    .side-note {
      display: none;
      margin-top: auto;
      border: 1px solid #dce4d9;
      border-radius: 18px;
      padding: 16px;
      color: #6d766e;
      background:
        radial-gradient(circle at 88% 10%, rgba(11, 95, 62, .12), transparent 72px),
        #ffffff;
      font-size: 12.5px;
      line-height: 1.55;
      box-shadow: 0 10px 24px rgba(31, 43, 35, .045);
    }

    main {
      padding: 26px;
      display: grid;
      gap: 20px;
      min-width: 0;
      min-height: calc(100vh - 24px);
      background: rgba(255, 255, 255, .72);
      border: 1px solid rgba(255, 255, 255, .82);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .topbar {
      position: sticky;
      top: 12px;
      z-index: 18;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, .88);
      border: 1px solid rgba(227, 231, 223, .92);
      border-radius: 22px;
      box-shadow: 0 18px 42px rgba(27, 38, 31, .10);
      backdrop-filter: blur(16px);
    }

    .top-logo {
      width: 101px;
      height: 58px;
      object-fit: contain;
      flex: 0 0 auto;
      opacity: .94;
    }

    .search-filter {
      width: min(660px, 100%);
      height: 46px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, .92);
      border: 1px solid #e7ece5;
      border-radius: 14px;
      padding: 0 12px 0 15px;
      box-shadow: 0 10px 28px rgba(31, 43, 35, .045);
    }

    .search-filter::before {
      content: "";
      width: 13px;
      height: 13px;
      border: 2px solid #8a948b;
      border-radius: 999px;
      box-shadow: 5px 5px 0 -4px #8a948b;
      transform: rotate(45deg);
      opacity: .8;
      flex: 0 0 auto;
    }

    .search-filter input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #16231b;
      font: inherit;
      font-size: 13px;
      font-weight: 620;
    }

    .search-filter input::placeholder {
      color: #9ca49b;
      font-weight: 560;
    }

    .search-filter kbd {
      min-width: 34px;
      height: 24px;
      border: 1px solid #e2e7df;
      border-radius: 8px;
      background: #f7f8f5;
      color: #8a948b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      font-family: inherit;
    }

    .doc-meta {
      min-width: 275px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      padding: 14px 16px;
      box-shadow: 0 8px 20px rgba(30, 48, 35, .05);
    }

    .doc-meta b {
      display: block;
      margin-bottom: 7px;
      color: var(--brand-dark);
    }

    .doc-meta span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 17px;
      padding: 17px 18px 16px;
      min-height: 94px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(27, 38, 31, .045);
    }

    .metric::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--cat);
      opacity: .72;
    }

    .metric:nth-child(1),
    .metric:nth-child(2),
    .metric:nth-child(3),
    .metric:nth-child(4) { --cat: #0b5f3e; }

    .metric:first-child {
      background:
        radial-gradient(circle at 82% 18%, rgba(255, 255, 255, .18), transparent 70px),
        linear-gradient(135deg, #0b5f3e, #084a31);
      border-color: transparent;
      box-shadow: 0 16px 34px rgba(11, 95, 62, .22);
    }

    .metric:first-child::before,
    .metric:first-child::after {
      display: none;
    }

    .metric:first-child span,
    .metric:first-child strong {
      color: #fff;
    }

    .metric:first-child span {
      opacity: .86;
    }

    .metric::after {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 1px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--cat) 28%, transparent), transparent);
    }

    .metric span {
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 720;
      letter-spacing: 0;
    }

    .metric strong {
      display: block;
      margin-top: 10px;
      font-size: 32px;
      line-height: 1;
      color: var(--brand-dark);
      font-weight: 850;
    }

    .category-section {
      scroll-margin-top: 24px;
      display: grid;
      gap: 16px;
      align-content: start;
      min-height: calc(100vh - 238px);
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      padding: 10px 2px 0;
    }

    .section-head h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      color: var(--brand-dark);
      font-weight: 850;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .section-head h2::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--cat);
      box-shadow: 0 0 0 5px var(--cat-soft);
    }

    .section-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13.5px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }

    .empty-state {
      grid-column: 1 / -1;
      min-height: 220px;
      border: 1px dashed #dce4d9;
      border-radius: 18px;
      background: rgba(255, 255, 255, .7);
      color: #7a8279;
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 14px;
      font-weight: 650;
    }

    .card {
      border: 1px solid rgba(218, 225, 216, .82);
      border-radius: 18px;
      background: var(--surface);
      min-height: 0;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      display: grid;
      grid-template-rows: 208px auto;
      position: relative;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: color-mix(in srgb, var(--cat) 35%, var(--line));
      box-shadow: var(--shadow-hover);
    }

    .photo {
      background:
        radial-gradient(circle at 50% 8%, rgba(255, 255, 255, .78), transparent 58%),
        linear-gradient(180deg, #edf4ec, #dfeade);
      border-bottom: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--cat-ink);
      font-weight: 760;
      font-size: 13px;
      overflow: hidden;
    }

    .photo img,
    .hero-photo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .card-body {
      padding: 14px 15px 15px;
      display: grid;
      grid-template-rows: auto auto 40px;
      gap: 10px;
      min-height: 0;
      background: #fff;
      position: relative;
    }

    .card h3 {
      margin: 0;
      padding-left: 12px;
      min-height: 31px;
      max-height: 58px;
      font-size: 22.5px;
      line-height: 1.24;
      color: var(--brand-dark);
      word-break: keep-all;
      overflow: hidden;
      font-weight: 850;
      position: relative;
    }

    .card h3::before {
      content: "";
      position: absolute;
      left: 0;
      top: .09em;
      height: 1.06em;
      width: 4px;
      border-radius: 999px;
      background: var(--cat);
      opacity: .84;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    .badge {
      border-radius: 999px;
      border: 1px solid transparent;
      background: #f1f1ec;
      color: #5c665d;
      padding: 5px 9px;
      font-size: 11.5px;
      line-height: 1;
      font-weight: 780;
      white-space: nowrap;
    }

    .badge.category-badge {
      background: var(--cat-soft);
      border-color: color-mix(in srgb, var(--cat) 20%, transparent);
      color: var(--cat-ink);
    }

    .badge.status-badge {
      background: #eef2ed;
      color: #405348;
      border-color: #dfe7dd;
    }

    .badge.video-badge {
      background: #eef3f6;
      color: #465f6b;
      border-color: #dce8ee;
    }

    .badge.pending {
      background: var(--pending);
      color: #9a5a18;
      border-color: #eadbc5;
    }

    .open-detail {
      align-self: end;
      width: 100%;
      height: 40px;
      border: 1px solid color-mix(in srgb, var(--cat) 22%, var(--line));
      border-radius: 999px;
      background: #fff;
      color: var(--cat-ink);
      font-weight: 820;
      cursor: pointer;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .72), 0 8px 16px rgba(28, 39, 31, .035);
      transition: background .18s ease, color .18s ease, border-color .18s ease, transform .18s ease;
    }

    .open-detail:hover {
      border-color: var(--cat);
      background: var(--cat);
      color: #fff;
      transform: translateY(-1px);
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(18, 28, 22, .30);
      backdrop-filter: blur(5px);
      display: none;
      z-index: 20;
    }

    .drawer-backdrop.open { display: block; }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(720px, 100vw);
      height: 100vh;
      background: #f6f7f3;
      border-left: 1px solid rgba(218, 225, 216, .92);
      box-shadow: -24px 0 60px rgba(25, 34, 28, .14);
      transform: translateX(102%);
      transition: transform .22s ease;
      z-index: 21;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .drawer.open { transform: translateX(0); }

    .drawer-head {
      padding: 28px 28px 24px;
      border-bottom: 1px solid rgba(218, 225, 216, .86);
      background:
        radial-gradient(circle at 92% 0%, rgba(11, 95, 62, .08), transparent 150px),
        rgba(255, 255, 255, .94);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
    }

    .drawer-head h2 {
      margin: 0;
      font-size: 27px;
      line-height: 1.24;
      color: var(--brand-dark);
      font-weight: 850;
      letter-spacing: 0;
    }

    .drawer-head span {
      display: inline-block;
      margin-top: 8px;
      color: #7a8279;
      font-size: 13px;
      font-weight: 620;
    }

    .close {
      border: 1px solid #e3e9df;
      background: #ffffff;
      color: #607063;
      border-radius: 14px;
      width: 42px;
      height: 42px;
      cursor: pointer;
      font-size: 23px;
      line-height: 1;
      box-shadow: 0 10px 24px rgba(45, 55, 43, .06);
      transition: background .18s ease, color .18s ease, border-color .18s ease, transform .18s ease;
    }

    .close:hover {
      background: var(--brand);
      border-color: var(--brand);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .drawer-body {
      overflow: auto;
      padding: 22px 28px 30px;
      display: grid;
      gap: 14px;
      align-content: start;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .42), transparent 180px),
        #f6f7f3;
    }

    .hero-photo {
      height: 300px;
      border: 1px dashed #c9d2c4;
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(89, 120, 93, .10), rgba(169, 120, 67, .10)), #f4f2eb;
      display: grid;
      place-items: center;
      color: #66806b;
      font-weight: 760;
      overflow: hidden;
    }

    .hero-photo img {
      object-fit: contain;
      background: #f4f2eb;
    }

    .recipe-video {
      border: 1px solid #e2e8df;
      border-radius: 18px;
      background: #0f1f17;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(31, 43, 35, .10);
    }

    .recipe-video video {
      width: 100%;
      max-height: 360px;
      display: block;
      background: #0f1f17;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .panel {
      border: 1px solid rgba(218, 225, 216, .9);
      border-radius: 18px;
      padding: 18px 18px 19px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 12px 30px rgba(45, 55, 43, .055);
    }

    .panel h3 {
      margin: 0 0 13px;
      color: var(--brand-dark);
      font-size: 16px;
      font-weight: 840;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel h3::before {
      content: "";
      width: 6px;
      height: 18px;
      border-radius: 999px;
      background: var(--brand);
    }

    .panel p,
    .panel li {
      color: #405047;
      font-size: 14px;
      line-height: 1.68;
    }

    .panel p { margin: 0; }

    .ingredient-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      border: 1px solid #e1e7de;
      border-radius: 14px;
      background: #fff;
    }

    .ingredient-table th,
    .ingredient-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #e8ede5;
      color: #405047;
      font-size: 14px;
      text-align: left;
    }

    .ingredient-table th {
      background: #f4f7f1;
      color: var(--brand-dark);
      font-weight: 820;
    }

    .ingredient-table tr:last-child td { border-bottom: 0; }

    .ingredient-table td:last-child {
      color: #23382d;
      font-weight: 800;
    }

    .panel ol,
    .panel ul {
      margin: 0;
      padding-left: 20px;
      display: grid;
      gap: 9px;
    }

    .notice {
      border-color: #efc6c2;
      background: #fff7f5;
    }

    .notice h3 { color: var(--warning); }

    @media (max-width: 1280px) {
      .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 1040px) {
      .shell { grid-template-columns: 230px minmax(0, 1fr); }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      .shell {
        display: block;
        width: 100%;
        min-height: 100vh;
        margin: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .sidebar {
        position: sticky;
        height: auto;
        top: 0;
        z-index: 20;
        padding: 10px 12px 9px;
        gap: 9px;
        border: 0;
        border-radius: 0;
        border-bottom: 1px solid var(--line);
        box-shadow: 0 10px 24px rgba(61, 68, 55, .09);
      }
      .brand {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-items: center;
        row-gap: 1px;
        padding: 0 2px;
      }
      .brand strong {
        font-size: 20px;
        line-height: 1.15;
        white-space: nowrap;
      }
      .brand strong br { display: none; }
      .brand span {
        grid-area: desc;
        max-width: none;
        font-size: 11px;
        line-height: 1.35;
        text-align: left;
        white-space: nowrap;
      }
      .nav-label {
        display: none;
      }
      .nav {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: max-content;
        grid-template-columns: none;
        gap: 7px;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 0 2px 4px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .nav::-webkit-scrollbar { display: none; }
      .nav button {
        width: auto;
        min-width: max-content;
        height: 38px;
        padding: 0 10px 0 18px;
        border-radius: 12px;
        gap: 8px;
        white-space: nowrap;
      }
      .nav button::before {
        left: 7px;
        width: 3px;
        top: 50%;
        bottom: auto;
        height: 0;
        border-radius: 999px;
        transform: translateY(-50%);
      }
      .nav button.active::before {
        height: 17px;
      }
      .nav small {
        min-width: 22px;
        height: 18px;
        padding: 0 7px;
        font-size: 10px;
      }

      const [cat, soft, ink] = categoryPalettes[categoryName] || ["#0b5f3e", "#e7efe9", "#16402e"];

      "모듬소세지": "assets/side/사이드_모듬소세지.jpg",

      "땡초간장치킨": "assets/twigim/튀김_땡초간장치킨.jpg",
      "청양유린기": "assets/twigim/튀김_청양유린기.jpg",
      "옛날떡꼬치튀김": "assets/twigim/튀김_옛날떡꼬치튀김.jpg",
      "닭똥집튀김": "assets/twigim/튀김_닭똥집튀김.jpg",

      "청X다방옥수수튀김": "assets/twigim/튀김_청X다방옥수수튀김.jpg",
      "직화데리야끼꼬치": "assets/skewer/꼬치_직화데리야끼꼬치.jpg",
      "닭목살꼬치": "assets/skewer/꼬치_닭목살꼬치.jpg",
      "닭껍질꼬치": "assets/skewer/꼬치_닭껍질꼬치.JPG",
      "메밀김치전병": "assets/jeon/전_김치메밀전병.jpg",
      "옛날쫀득감자전": "assets/jeon/전_옛날쫀득감자전.jpg",
      "페퍼로니치즈감자채전": "assets/jeon/전_페퍼로니치즈감자채전.jpg",
      "묵은지김치전": "assets/jeon/전_묵은지김치전.jpg",
      "해물부추전": "assets/jeon/전_해물부추전.jpg",
      "소고기육전": "assets/jeon/전_육전.jpg",
      "딸기하이볼": "assets/highball/딸기하이볼.png",
      "말리부오렌지": "assets/highball/말리부오렌지.png",
      "말리부파인": "assets/highball/말리부파인.png",
      "망고하이볼": "assets/highball/망고하이볼.png",
      "시그니처백주하이볼": "assets/highball/시그니처백주하이볼.png",
      "산토리레몬하이볼": "assets/highball/산토리레몬하이볼.png",
      "얼그레이하이볼": "assets/highball/얼그레이하이볼.png",
      "진저하이볼": "assets/highball/진저하이볼.png",
      "파인생과일하이볼": "assets/highball/파인생과일하이볼.png",
      "핑크구아바하이볼": "assets/highball/핑크구아바하이볼.png",
      "유자하이볼": "assets/highball/유자하이볼.png",
      "우동(기본)": "assets/basic/기본_우동.jpg",
      "콘치즈(기본)": "assets/basic/기본_콘치즈.jpg",
      "두부김치(기본)": "assets/basic/기본_두부김치.jpg",
      "아이스크림(기본)": "assets/basic/기본_아이스크림.jpg"
    };
    const menuVideos = {
      "일본식오뎅탕": "assets/videos/일본식오뎅탕.mp4"
    };
    const renderPhoto = (menu, size = "card") => {
      const image = menuImages[menu];
      if (!image) return size === "card" ? "메뉴 사진 영역" : "완성 메뉴 사진 영역";
      return `<img src="${image}" alt="${menu} 사진" loading="lazy">`;
    };
    const renderVideo = (menu) => {
      const video = menuVideos[menu];
      if (!video) return "";
      return `
        <section class="panel">
          <h3>레시피 영상</h3>
          <div class="recipe-video">
            <video controls preload="metadata" src="${video}"></video>
          </div>
        </section>
      `;
    };
    const cleanStepText = (step) => step.replace(/^\s*\d+\.\s*/, "").trim();
    const totalMenus = categories.reduce((sum, category) => sum + category.menus.length, 0);
    const allMenuNames = new Set(categories.flatMap((category) => category.menus));
    const readyRecipeCount =
      Object.keys(recipeDetails).filter((menu) => allMenuNames.has(menu)).length +
      Object.keys(highballDetails).filter((menu) => allMenuNames.has(menu)).length;

    document.getElementById("totalMenus").textContent = totalMenus;
    document.getElementById("totalCategories").textContent = categories.length;
    document.getElementById("readyRecipes").textContent = readyRecipeCount;
    document.getElementById("photoSlots").textContent = totalMenus;

    const categoryNav = document.getElementById("categoryNav");
    categoryNav.innerHTML = categories.map((category, index) => `
      <button class="${index === 0 ? "active" : ""}" style="${categoryStyle(category.name)}" data-category="${category.name}">
        ${category.name}<small>${category.menus.length}</small>
      </button>
    `).join("");

    const categorySections = document.getElementById("categorySections");
    const menuSearch = document.getElementById("menuSearch");
    let activeCategoryName = categories[0].name;

    const renderCategory = (categoryName) => {
      const category = categories.find((item) => item.name === categoryName) || categories[0];
      activeCategoryName = category.name;
      const query = (menuSearch?.value || "").trim().toLowerCase();
      const visibleMenus = category.menus.filter((menu) => menu.toLowerCase().includes(query));
      categorySections.innerHTML = `
      <section class="category-section" id="${slug(category.name)}" style="${categoryStyle(category.name)}">
        <div class="section-head">
          <div>
            <h2>${category.name}</h2>
            <p>${visibleMenus.length}개 메뉴 · ${query ? "검색 결과 표시 중" : "선택한 카테고리만 표시 중"}</p>
          </div>
        </div>
        <div class="cards">
          ${visibleMenus.length ? visibleMenus.map((menu) => {
            const detail = recipeDetails[menu] || highballDetails[menu];
            return `
              <article class="card" style="${categoryStyle(category.name)}">
                <div class="photo">${renderPhoto(menu)}</div>
                <div class="card-body">
                  <h3>${menu}</h3>
                  <div class="badge-row">
                    <span class="badge category-badge">${category.name}</span>
                    <span class="badge status-badge ${detail ? "" : "pending"}">${detail ? "레시피 등록" : "등록 예정"}</span>
                    ${menuVideos[menu] ? `<span class="badge video-badge">영상 있음</span>` : ""}
                  </div>
                  <button class="open-detail" data-menu="${menu}" data-category="${category.name}">레시피 보기</button>
                </div>
              </article>
            `;
          }).join("") : `<div class="empty-state">검색 결과가 없습니다.</div>`}
        </div>
      </section>
    `;
    };

    renderCategory(categories[0].name);
    menuSearch?.addEventListener("input", () => renderCategory(activeCategoryName));
    document.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "f") {
        event.preventDefault();
        menuSearch?.focus();
      }
    });

    const drawer = document.getElementById("drawer");
    const backdrop = document.getElementById("backdrop");
    const drawerTitle = document.getElementById("drawerTitle");
    const drawerSub = document.getElementById("drawerSub");
    const drawerBody = document.getElementById("drawerBody");

    const openRecipe = (menu, category) => {
      const detail = recipeDetails[menu];
      const highball = highballDetails[menu];
      drawerTitle.textContent = menu;
      drawerSub.textContent = highball ? `${category} · 하이볼 레시피` : detail ? `${category} · ${detail.time}` : `${category} · 레시피 등록 예정`;

      if (!detail && !highball) {
        drawerBody.innerHTML = `
          <section class="panel">
            <h3>레시피 등록 예정</h3>
            <p>엑셀 메뉴 구성에는 포함되어 있으나, 현재 연결된 상세 레시피 데이터는 없습니다. 추후 HWP, 엑셀, 이미지 자료가 추가되면 이 영역에 재료, 조리 순서, 고명 정보를 연결합니다.</p>
          </section>
        `;
      } else if (highball) {
        drawerBody.innerHTML = `
          <section class="panel">
            <h3>재료 / 용량</h3>
            <table class="ingredient-table">
              <thead>
                <tr>
                  <th>재료</th>
                  <th>용량</th>
                </tr>
              </thead>
              <tbody>
                ${highball.ingredients.map(([ingredient, amount]) => `
                  <tr>
                    <td>${ingredient}</td>
                    <td>${amount}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </section>
          <section class="panel">
            <h3>세팅</h3>
            <p>${highball.setting || "별도 세팅 없음"}</p>
          </section>
          ${highball.caution ? `<section class="panel notice"><h3>필수 주의사항</h3><p>${highball.caution}</p></section>` : ""}
        `;
      } else {
        drawerBody.innerHTML = `
          ${renderVideo(menu)}
          ${detail.recipe ? `
          <section class="panel">
            <h3>${detail.recipeTitle || "레시피"}</h3>
            <ol>${detail.recipe.map((step) => `<li>${cleanStepText(step)}</li>`).join("")}</ol>
          </section>
          <section class="panel">
            <h3>고명</h3>
            <p>${detail.garnish || "별도 고명 없음"}</p>
          </section>
          <section class="panel">
            <h3>소스</h3>
            <p>${detail.sauce || "별도 소스 없음"}</p>
          </section>
          ` : `
          <div class="detail-grid">
            <section class="panel">
              <h3>주요 재료</h3>
              <p>${detail.ingredients}</p>
            </section>
            <section class="panel">
              <h3>고명 / 세팅</h3>
              <p>${detail.garnish || "별도 고명 없음"}</p>
            </section>
          </div>
          ${detail.caution ? `<section class="panel notice"><h3>필수 주의사항</h3><p>${detail.caution}</p></section>` : ""}
          <section class="panel">
            <h3>조리 순서</h3>
            <ol>${detail.steps.map((step) => `<li>${cleanStepText(step)}</li>`).join("")}</ol>
          </section>
          `}
        `;
      }

      drawer.classList.add("open");
      backdrop.classList.add("open");
    };

    document.addEventListener("click", (event) => {
      const button = event.target.closest(".open-detail");
      if (button) openRecipe(button.dataset.menu, button.dataset.category);
    });

    const closeDrawer = () => {
      drawer.classList.remove("open");
      backdrop.classList.remove("open");
    };

    document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
    backdrop.addEventListener("click", closeDrawer);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeDrawer();
    });

    document.querySelectorAll(".nav button").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".nav button").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        renderCategory(button.dataset.category);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  </script>
</body>
</html>
